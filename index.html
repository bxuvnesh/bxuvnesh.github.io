  <style>
    :root {
      --bg: #0d1b17;
      --ink: #e4e9e6;
      --mint: #4fd8a4;
      --ash: #98a5a0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      align-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }
    /* soft mint glow */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(60vmax 60vmax at 90% 0%, rgba(79, 216, 164, 0.16), transparent 70%);
      pointer-events: none;
    }
    /* checkerboard, a nod to the GitHub avatar */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-conic-gradient(var(--mint) 0% 25%, transparent 0% 50%) 0 0 / 56px 56px;
      opacity: 0.08;
      -webkit-mask-image: linear-gradient(to bottom left, #000, transparent 60%);
      mask-image: linear-gradient(to bottom left, #000, transparent 60%);
      pointer-events: none;
    }
    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: clamp(1.5rem, 6vw, 4rem);
    }
    .avatar {
      display: block;
      width: clamp(88px, 18vw, 132px);
      height: auto;
      aspect-ratio: 1;
      margin: 0 0 1.6rem;
      border: 3px solid var(--mint);
      border-radius: 50%;
      object-fit: cover;
      animation: fade 0.7s ease 0.1s both;
    }
    h1 {
      margin: 0;
      font-size: clamp(3.8rem, 16vw, 10rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.035em;
    }
    .line { display: block; overflow: hidden; padding-bottom: 0.06em; }
    .line span { display: inline-block; animation: rise 0.85s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .line:nth-child(2) span { animation-delay: 0.12s; }
    .handle {
      margin: 1.5rem 0 0;
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 600;
      color: var(--mint);
      animation: fade 0.7s ease 0.45s both;
    }
    .bio {
      margin: 0.6rem 0 0;
      max-width: 34ch;
      font-size: 1.2rem;
      line-height: 1.5;
      color: var(--ash);
      animation: fade 0.7s ease 0.55s both;
    }
    ul {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin: 2.4rem 0 0;
      padding: 0;
      list-style: none;
      animation: fade 0.7s ease 0.7s both;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.75rem 1.4rem;
      border: 2px solid var(--ash);
      border-radius: 999px;
      color: var(--ink);
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.15s;
    }
    a svg { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    a:hover, a:focus-visible { border-color: var(--mint); color: var(--mint); transform: translateY(-2px); }
    a.primary { background: var(--mint); border-color: var(--mint); color: var(--bg); }
    a.primary:hover, a.primary:focus-visible { background: #7ae9bf; border-color: #7ae9bf; color: var(--bg); }
    a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    footer {
      margin-top: 4rem;
      font-size: 0.9rem;
      color: var(--ash);
      animation: fade 0.7s ease 0.9s both;
    }
    @keyframes rise { from { transform: translateY(105%); } to { transform: none; } }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
